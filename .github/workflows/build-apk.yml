name: Gerar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # necessário para publicar o APK em Releases quando houver tag

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar a parte Android do projeto
        run: flutter create --platforms=android --org br.com.cleici --project-name lembrete_agua .

      - name: Ajustar permissões e notificações
        run: python3 tool/patch_android.py

      - name: Baixar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze lib --no-fatal-infos

      - name: Compilar o APK
        run: flutter build apk --release

      - name: Guardar o APK desta execução
        uses: actions/upload-artifact@v4
        with:
          name: lembrete-agua-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar em Releases (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
